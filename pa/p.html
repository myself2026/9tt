        ];

        let currentCategory = 'all';

        function renderProducts() {
            const search = document.getElementById('product-search').value.toLowerCase();
            const tableBody = document.getElementById('product-table-body');
            const grid = document.getElementById('product-grid');
            const emptyState = document.getElementById('empty-state');

            const filtered = products.filter(p =>
                (currentCategory === 'all' || p.cat === currentCategory) &&
                (p.title.toLowerCase().includes(search) || p.desc.toLowerCase().includes(search))
            );

            tableBody.innerHTML = '';
            grid.innerHTML = '';

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                filtered.forEach(p => {
                    // Desktop Row
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-slate-50 transition duration-300";
                    tr.innerHTML = `
                        <td class="px-8 py-4">
                            <img src="${p.img}" alt="${p.title}" class="w-20 h-20 object-cover rounded-2xl cursor-zoom-in border border-slate-100 shadow-sm" onclick="openLightbox('${p.img}')">
                        </td>
                        <td class="px-8 py-4">
                            <span class="text-[9px] bg-slate-100 px-2 py-0.5 rounded text-slate-500 font-black uppercase mb-1 inline-block">${p.cat}</span>
                            <h4 class="text-base font-black text-slate-900 leading-tight">${p.title}</h4>
                            <p class="text-xs text-slate-500 mt-1">${p.desc}</p>
                        </td>
                        <td class="px-8 py-4">
                            <div class="text-orange-600 font-black text-xl">${p.price}</div>
                            <span class="text-[10px] text-green-600 font-bold flex items-center gap-1 mt-1"><i class="fas fa-check-circle"></i> พร้อมส่งทันที</span>
                        </td>
                        <td class="px-8 py-4 text-center">
                            <a href="https://lin.ee/Yr9sqDZ?text=สนใจสินค้า: ${p.title}" target="_blank" class="inline-flex flex-col items-center gap-1 group">
                                <div class="w-12 h-12 bg-orange-500 text-white rounded-2xl flex items-center justify-center group-hover:scale-110 active:scale-90 transition shadow-lg shadow-orange-500/30">
                                    <i data-lucide="shopping-cart" class="w-6 h-6"></i>
                                </div>
                                <span class="text-[10px] font-black text-slate-400">สั่งซื้อ</span>
                            </a>
                        </td>
                    `;
                    tableBody.appendChild(tr);

                    // Mobile Card
                    const card = document.createElement('div');
                    card.className = "bg-white p-5 rounded-[2.5rem] border border-slate-100 product-card flex flex-col";
                    card.innerHTML = `
                        <div class="relative mb-4">
                            <img src="${p.img}" alt="${p.title}" class="w-full h-56 object-cover rounded-[2rem] shadow-md" onclick="openLightbox('${p.img}')">
                            <span class="absolute top-4 right-4 bg-slate-900 text-white text-[10px] font-black px-3 py-1.5 rounded-full shadow-xl">${p.tag}</span>
                        </div>
                        <div class="flex-1">
                            <h4 class="text-xl font-black text-slate-900 mb-1 leading-tight">${p.title}</h4>
                            <p class="text-xs text-slate-500 leading-relaxed mb-6">${p.desc}</p>
                        </div>
                        <div class="flex items-center justify-between pt-4 border-t border-slate-50">
                            <div>
                                <p class="text-[9px] text-slate-400 font-black uppercase tracking-widest mb-0.5">ราคาโรงงาน</p>
                                <p class="text-xl font-black text-orange-600">${p.price}</p>
                            </div>
                            <a href="https://lin.ee/Yr9sqDZ?text=สนใจสินค้า: ${p.title}" target="_blank" class="bg-slate-900 text-white px-6 py-3.5 rounded-[1.5rem] font-black text-xs shadow-xl active:scale-95 transition">สั่งซื้อด่วน</a>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }
            lucide.createIcons();
        }

        function filterCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderProducts();
        }

        document.getElementById('product-search').addEventListener('input', renderProducts);

        const modal = document.getElementById('lightbox-modal');
        const modalImg = document.getElementById('lightbox-img');

        function openLightbox(src) {
            modalImg.src = src;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            lucide.createIcons();
        }

        function closeLightbox() {
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        lucide.createIcons();
        renderProducts();
    </script>
